[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "httpmas"
version = "3.6.5"
description = "Thư viện HTTP client thuần Python, dựa trên socket, hỗ trợ TLS và bất đồng bộ - async"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [{name = "PyMaKaizu & MinhAnhs & Nguyễn Tấn Dũng"}]
keywords = ["http", "client", "socket", "tls", "async"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
]

[project.scripts]
httpmas = "httpmas.cli:cli_entry"

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
include = ["httpmas*"]
exclude = ["tests*", "docs*"]