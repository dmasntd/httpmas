[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "httpmas"
version = "2.9.18"
description = "Thư viện HTTPS Client, sync & async, TLS 1.3"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [{name = "Nguyễn Tấn Dũng"}]
keywords = ["http", "client", "socket", "tls", "async", "httpmas", "httpsclient", "https client"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: 3.16",
    "Topic :: Internet :: WWW/HTTP",
]

[project.scripts]
httpmas = "httpmas.cli:cli_entry"

[tool.setuptools.packages.find]
include = ["httpmas*"]
exclude = ["tests*", "docs*"]
